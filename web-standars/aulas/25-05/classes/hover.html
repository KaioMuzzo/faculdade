<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            gap: 60px;
        }

        .card {
            width: 200px;
            height: 200px;
            border: 2px solid black;
        }

        .card:hover {
            background-color: red;
        }

        .card:active {
            background-color: blue;
        }

        button:hover {
            background-color: red;
            cursor: pointer;
        }

        button:active {
            background-color: blue;
        }
    </style>
</head>
<body>
    <button>button</button>
    <div class="card"></div>
</body>
</html>
