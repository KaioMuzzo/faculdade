<meta charset="UTF-8">
<script>
    function somalista(lista) {
        let soma = 0;
        for(i = 0; i < lista.length; i++) {
            soma += lista[i];
        }
        return soma;
    }

    const numeros = [1, 2, 3, 4, 5];
    document.write(somalista(numeros) + "<br>");
    document.write(soma);
</script>
