<meta charset="UTF=8">
<script>
    // crie um programa que peca ao usuario que digite cinco numeros inteiros
    const num = [];
    for (i = 0; i < 5; i++) {
        num[i] = parseInt(window.prompt('Digite um número: '));
    }

    // apos a digitacao dos cinco numeros eles devem ser exibidos em uma lista um abaixo do outro
    for (i = 0; i < num.length; i++) {
        document.write('<br> ' + num[i]);
    }

    document.write('<br>');

    // tambem devera mostrar os cinco numeros na ordem inversa a da insercao um abaixo do outro
    for (i = num.length - 1; i >= 0; i--) {
        document.write('<br> ' + num[i]);
    }
</script>
