<meta charset="UTF=8">
<script>
    const array1 = [];
    const array2 = [];
    const array3 = [];

    for (i=0; i < 5; i++) {
        array1[i] = parseInt(window.prompt('[PRIMEIRA LISTA] Digite um numero'));
        document.write(array1[i] + ' ');
    }

    document.write('<br>');

    for (i=0; i < 5; i++) {
        array2[i] = parseInt(window.prompt('[SEGUNDA LISTA] Digite um numero'));
        document.write(array2[i] + ' ');
    }

    document.write('<br>');

    for (i=0; i < 5; i++) {
        array3[i] = array1[i] - array2[i];
        document.write(array3[i] + ' ');
    }
</script>
